name: Release

on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]

permissions:
  contents: read

jobs:
  artifacts:
    name: Artifacts
    # Publishes dexidp/dex's images (ghcr.io, Docker Hub). The giantswarm fork
    # publishes its images from CircleCI to gsoci.azurecr.io instead.
    if: github.repository == 'dexidp/dex'
    uses: ./.github/workflows/artifacts.yaml
    with:
      publish: true
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    permissions:
      attestations: write
      contents: read
      packages: write
      id-token: write
      security-events: write
